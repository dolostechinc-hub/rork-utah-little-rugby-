name: Generate Android Keystore

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java (for keytool)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate keystore (.jks)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "keystore_pw_len=${#ANDROID_KEYSTORE_PASSWORD}"
          echo "key_pw_len=${#ANDROID_KEY_PASSWORD}"
          echo "alias_set=$([ -n "$ANDROID_KEY_ALIAS" ] && echo yes || echo no)"

          keytool -genkeypair \
            -v \
            -storetype JKS \
            -keystore upload-keystore.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=ExpoUpload, OU=Mobile, O=YourOrg, L=City, S=State, C=US"

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: upload-keystore
          path: upload-keystore.jks
